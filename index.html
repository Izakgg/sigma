<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligência Artificial - Drag & Drop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Inteligência Artificial</h1>
            <p>Arraste as caixas de palavras para organizar os conceitos</p>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <h2>Conceitos de IA</h2>
                <div class="keywords-list" id="keywords-list">
                    <!-- Caixas de palavras serão geradas aqui -->
                </div>
                <button class="reset-btn" onclick="resetLayout()">🔄 Resetar</button>
            </aside>

            <main class="canvas">
                <div class="drop-zone" id="drop-zone">
                    <p class="placeholder">👇 Arraste os conceitos aqui</p>
                </div>
            </main>
        </div>

        <footer>
            <p>Criado com ❤️ | Aprenda sobre IA de forma interativa</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
